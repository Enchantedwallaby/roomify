[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

# React Router SPA fallback so direct visits/refreshes of routes such as
# /visualizer/:id are handled by the client router instead of returning 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
